[project]
name = "serial-console-mcp"
version = "0.3.0"
description = "An MCP server that lets Claude Desktop drive a serial console: network craft ports, CAT radios, Icom CI-V, rotators, microcontrollers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Stefan Brunner (AE5VG)", email = "me@stefanbrunner.org" },
]
keywords = [
    "serial",
    "serial-port",
    "console",
    "mcp",
    "model-context-protocol",
    "pyserial",
    "ham-radio",
    "cat",
    "ci-v",
    "craft-port",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Ham Radio",
    "Topic :: System :: Hardware",
    "Topic :: Terminals :: Serial",
]
dependencies = [
    "pyserial>=3.5",
    "mcp>=1.2.0,<2",
]

[project.optional-dependencies]
# What the installer build needs. `--collect-all mcp` walks every SDK submodule,
# including mcp.cli, which imports typer from the SDK's [cli] extra.
freeze = [
    "mcp[cli]>=1.2.0,<2",
    "pyinstaller>=6.0",
    "pyte>=0.8.2",
]
screen = [
    "pyte>=0.8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
serial-console-mcp = "serial_console_mcp.server:main"

[project.urls]
Homepage = "https://github.com/sbrunner-atx/serial-console-mcp"
Repository = "https://github.com/sbrunner-atx/serial-console-mcp"
Issues = "https://github.com/sbrunner-atx/serial-console-mcp/issues"
"Field Guide" = "https://github.com/sbrunner-atx/serial-console-mcp/blob/main/docs/serial-console-mcp%20Field%20Guide.pdf"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serial_console_mcp"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/_hosttest", "/docs/brand", "/dist", "/.venv", "*.pkg", "*.exe"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["_hosttest"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
