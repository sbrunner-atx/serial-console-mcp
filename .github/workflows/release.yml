name: Release

# Publishes the sdist + wheel to PyPI. Fires when a GitHub Release is published
# (`gh release create vX.Y.Z`), or by hand from the Actions tab / `gh workflow run`.
# The release tag's version must match pyproject.toml.
#
# Auth: the PYPI_API_TOKEN repository secret. Trusted Publishing (OIDC) is also
# wired (id-token: write); to switch to it, register the publisher on pypi.org
# (workflow release.yml, environment release) and delete the `password:` line.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
